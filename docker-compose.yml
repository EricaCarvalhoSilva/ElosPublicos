services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: elospublicos
      POSTGRES_USER: elos
      POSTGRES_PASSWORD: elos123
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elos -d elospublicos"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./src
    environment:
      POSTGRES_DB: elospublicos
      POSTGRES_USER: elos
      POSTGRES_PASSWORD: elos123
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados_postgres:
